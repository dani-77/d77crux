name: Check for package updates

on:
  schedule:
    # Every Sunday at 23:00 Europe/Lisbon time. GitHub Actions cron always
    # runs in UTC and has no DST/timezone awareness, so both possible UTC
    # offsets are scheduled every week; the "Only run at 23:00 Lisbon time"
    # gate job below checks the real Europe/Lisbon clock (tzdata-aware, so
    # it tracks DST automatically) and skips the run that isn't actually
    # 23:00 locally. No manual adjustment needed at DST changeovers.
    - cron: '0 22 * * 0'  # 23:00 WEST (UTC+1, summer)
    - cron: '0 23 * * 0'  # 23:00 WET  (UTC+0, winter)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Only run at 23:00 Lisbon time
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hour=$(TZ=Europe/Lisbon date +%H)
            if [ "$hour" = "23" ]; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "It's $hour:00 in Europe/Lisbon, not 23:00 -- skipping (the other scheduled trigger this week handles the current DST offset)."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  check-updates:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check upstream sources for newer versions
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/check_updates.py \
            --root . \
            --exclude-file .github/autoupdate-exclude.txt \
            --summary-file update-summary.md

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Automated package version update"
          title: "Automated package version updates"
          body-path: update-summary.md
          branch: auto/update-versions
          delete-branch: true
          labels: automated-update
