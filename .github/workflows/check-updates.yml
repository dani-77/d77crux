name: Check for package updates

on:
  schedule:
    # Every Sunday at 23:00 Europe/Lisbon time. GitHub Actions cron always
    # runs in UTC, so this is pinned to the current WEST (UTC+1, summer)
    # offset -- shift to '0 23 * * 0' once Portugal switches back to WET
    # (UTC+0) at the end of October, and back to '0 22 * * 0' at the end of
    # March.
    - cron: '0 22 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream sources for newer versions
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/check_updates.py \
            --root . \
            --exclude-file .github/autoupdate-exclude.txt \
            --summary-file update-summary.md

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Automated package version update"
          title: "Automated package version updates"
          body-path: update-summary.md
          branch: auto/update-versions
          delete-branch: true
          labels: automated-update
