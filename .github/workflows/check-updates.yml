name: Check for package updates

on:
  schedule:
    # Every Sunday around 23:00 Europe/Lisbon time. GitHub Actions cron always
    # runs in UTC and has no DST/timezone awareness, so both possible UTC
    # offsets are scheduled every week; scheduled runs can also fire over an
    # hour late under runner load, so matching "is it exactly this clock
    # hour" was unreliable (both triggers kept missing their window and the
    # real check silently never ran for weeks). The gate job below instead
    # checks "did the real check-updates job already succeed this week?" via
    # the Actions API, which is immune to both the DST offset and the
    # scheduling delay: whichever of the two crons fires first each week does
    # the work, the other is a no-op.
    - cron: '0 22 * * 0'
    - cron: '0 23 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Skip if this week's check already ran
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Start of the current week (Monday 00:00) in Europe/Lisbon, as an
          # epoch second.
          week_start=$(TZ=Europe/Lisbon date -d 'last monday 00:00' +%s)

          ran_this_week=false
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows/check-updates.yml/runs?per_page=20" \
                        --jq '.workflow_runs[] | select(.status=="completed") | .id'); do
            created=$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq '.created_at')
            created_epoch=$(date -d "$created" +%s)
            # Runs come back newest-first, so once we hit one older than the
            # start of this week, every run after it is older still.
            [ "$created_epoch" -lt "$week_start" ] && break

            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
                           --jq '.jobs[] | select(.name=="check-updates") | .conclusion' | head -1)
            if [ "$conclusion" = "success" ]; then
              ran_this_week=true
              break
            fi
          done

          if [ "$ran_this_week" = "true" ]; then
            echo "The real check-updates job already succeeded this week -- skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful check-updates run yet this week -- proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  check-updates:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check upstream sources for newer versions
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/check_updates.py \
            --root . \
            --exclude-file .github/autoupdate-exclude.txt \
            --summary-file update-summary.md

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Automated package version update"
          title: "Automated package version updates"
          body-path: update-summary.md
          branch: auto/update-versions
          delete-branch: true
          labels: automated-update
